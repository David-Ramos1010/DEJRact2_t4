<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${proyecto}">Empleados</title>
</head>
<body>
    <h1 th:text="${proyecto}">Proyecto</h1>
    <p>Autor: <strong th:text="${autor}">Autor</strong></p>

    <h2>Lista de empleados</h2>

    <form th:action="@{/empleados}" method="get">
        <label>Filtrar por puesto:
            <input type="text" name="puesto" th:value="${filtro}">
        </label>
        <button type="submit">Filtrar</button>
        <a th:href="@{/empleados}">Quitar filtro</a>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Puesto</th>
                <th>Edad</th>
                <th>Detalle</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${empleados}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.puesto}"></td>
                <td th:text="${e.edad}"></td>
                <td><a th:href="@{/empleados/{id}(id=${e.id})}">Ver</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="5">No hay empleados para mostrar.</td>
            </tr>
        </tbody>
    </table>

    <p><a th:href="@{/empleados/nuevo}">Agregar empleado</a></p>
</body>
</html>
